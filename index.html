<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>💪 Fitness Tracker</h1>
        <p class="subtitle">Track your daily fitness activities</p>

        <!-- Summary Dashboard -->
        <div class="dashboard">
            <div class="stat-card">
                <div class="stat-icon">🚶</div>
                <div class="stat-info">
                    <span class="stat-label">Total Steps</span>
                    <span class="stat-value" id="totalSteps">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-info">
                    <span class="stat-label">Calories Burned</span>
                    <span class="stat-value" id="totalCalories">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-info">
                    <span class="stat-label">Total Workouts</span>
                    <span class="stat-value" id="totalWorkouts">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-info">
                    <span class="stat-label">Days Active</span>
                    <span class="stat-value" id="activeDays">0</span>
                </div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section">
            <h3>📊 Weekly Progress</h3>
            <div class="progress-bars" id="progressBars">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Add Workout Form -->
        <div class="form-section">
            <h3>➕ Log New Workout</h3>
            <div class="form-group">
                <label>Exercise Type</label>
                <select id="exerciseType">
                    <option value="Walking">🚶 Walking</option>
                    <option value="Running">🏃 Running</option>
                    <option value="Cycling">🚴 Cycling</option>
                    <option value="Swimming">🏊 Swimming</option>
                    <option value="Yoga">🧘 Yoga</option>
                    <option value="Weight Training">🏋️ Weight Training</option>
                    <option value="Dancing">💃 Dancing</option>
                    <option value="Other">📝 Other</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Duration (minutes)</label>
                    <input type="number" id="duration" placeholder="e.g., 30" min="1" />
                </div>
                <div class="form-group">
                    <label>Calories Burned</label>
                    <input type="number" id="calories" placeholder="e.g., 200" min="0" />
                </div>
            </div>
            <div class="form-group">
                <label>Steps (optional)</label>
                <input type="number" id="steps" placeholder="e.g., 5000" min="0" />
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="workoutDate" />
            </div>
            <button id="addWorkoutBtn" class="add-btn">➕ Log Workout</button>
        </div>

        <!-- Workout History -->
        <div class="history-section">
            <h3>📋 Workout History</h3>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="Walking">🚶 Walking</button>
                <button class="filter-btn" data-filter="Running">🏃 Running</button>
                <button class="filter-btn" data-filter="Cycling">🚴 Cycling</button>
                <button class="filter-btn" data-filter="Swimming">🏊 Swimming</button>
                <button class="filter-btn" data-filter="Yoga">🧘 Yoga</button>
            </div>
            <div id="workoutList" class="workout-list">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Clear Data -->
        <div class="clear-section">
            <button id="clearDataBtn" class="clear-btn">🗑️ Clear All Data</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
